# new-api Nginx 反代配置
# 复制到 /etc/nginx/sites-available/new-api
# 然后 ln -s /etc/nginx/sites-available/new-api /etc/nginx/sites-enabled/
# 域名解析生效后，用 certbot 申请证书

upstream new-api-backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;  # 域名解析前先用 IP 访问

    # 先 HTTP 部署测试，后续加 HTTPS
    client_max_body_size 64m;

    location / {
        proxy_pass http://new-api-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（流式输出）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

