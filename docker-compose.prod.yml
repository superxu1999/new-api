# New-API Production Deployment
# 用法：docker compose -f docker-compose.prod.yml up -d --build
#
# 前置条件：
#   1. 在云服务器上安装 Docker + Compose
#   2. 将以下 CHANGEME 替换为实际密码/密钥
#   3. 配置 Nginx 反代 + HTTPS（参考 deploy/nginx.conf）

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: new-api-prod
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"   # 只监听本地，由 Nginx 反代
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # ---- 数据库 ----
      - SQL_DSN=postgresql://newapi:CHANGEME_PG_PASS@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:CHANGEME_REDIS_PASS@redis:6379/0

      # ---- 安全 ----
      - SESSION_SECRET=CHANGEME_SESSION_SECRET
      - CRYPTO_SECRET=CHANGEME_CRYPTO_SECRET

      # ---- 基本配置 ----
      - TZ=Asia/Shanghai
      - NODE_NAME=aliyun-prod-1
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - STREAMING_TIMEOUT=300

      # ---- HTTPS 会话安全（配置域名后启用） ----
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://你的域名

    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: new-api-redis
    restart: always
    command: ["redis-server", "--requirepass", "CHANGEME_REDIS_PASS"]
    networks:
      - new-api-network

  postgres:
    image: postgres:16-alpine
    container_name: new-api-pg
    restart: always
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: CHANGEME_PG_PASS
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network

volumes:
  pg_data:

networks:
  new-api-network:
    driver: bridge
